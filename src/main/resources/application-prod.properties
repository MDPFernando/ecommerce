spring.datasource.url=jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:ecommerce}}
spring.datasource.username=${DB_USER:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:production_password_change_me}}
spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8081}
spring.thymeleaf.cache=true

# Fast Startup Optimizations for Cloud Containers
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000

# Google OAuth Client
google.client.id=${GOOGLE_CLIENT_ID:974329213397-s8dcis01flqks7mts448h3r6s1f461eh.apps.googleusercontent.com}
